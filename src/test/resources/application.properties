spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update


# Tests need *a* value for this placeholder or the Spring context fails to load
# (SecurityConfig injects it via @Value). Not a secret: it signs remember-me
# cookies only within the in-memory H2 test context.
aviary.remember-me.key=test-key-not-a-secret

# Same story: AeroKeyHolder needs a real base64 AES-256 key or its constructor
# throws and takes the whole Spring context down with it. Not the real dev/prod
# key (that lives in .env, gitignored) — generated fresh, only ever encrypts
# throwaway values in the in-memory H2 test context.
aviary.aero-api-key.secret=R9dZLqm/C2AZP/BSNoKen2zLd59P86OoWn5Xtvb7SVQ=

# OAuth issuer for MCP sign-in; same value the main config defaults to.
aviary.oauth.issuer=http://localhost:8080

# Same MCP transport as the app (this file replaces the main application.properties in tests).
spring.ai.mcp.server.name=aviary
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
