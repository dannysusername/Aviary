spring:
  datasource:
    url: jdbc:h2:mem:browsertestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Same as Heroku (application-heroku.properties), so browser tests catch
    # lazy-loading bugs that only show in production (spec 012 R1).
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
