spring.profiles.active: h2

# Load key=value pairs from .env / sendgrid.env in the project root (optional: no error if absent).
# sendgrid.env is gitignored and holds SENDGRID_API_KEY only.
spring.config.import=optional:file:.env[.properties],optional:file:sendgrid.env[.properties]
# Spring Boot Multipart Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Tomcat Server Limits
server.tomcat.max-http-form-post-size=55MB
server.tomcat.max-swallow-size=60MB

aviary.remember-me.key=${AVIARY_REMEMBER_ME_KEY:dev-remember-me-key-change-me}
aviary.aero-api-key.secret=${AVIARY_AERO_KEY:dev-only-fallback-not-secure}

# SendGrid email (Share/Export + Maintenance Alerts -- see docs/SHARE_EXPORT_SPEC.md
# and docs/ALERTS_SPEC.md). Key lives in the gitignored sendgrid.env.
# from-email must be a SendGrid-verified sender.
aviary.sendgrid.api-key=${SENDGRID_API_KEY:}
aviary.sendgrid.from-email=${AVIARY_SENDGRID_FROM:}
aviary.sendgrid.from-name=${AVIARY_SENDGRID_FROM_NAME:Aviary Service}

# Maintenance alerts. base-url builds the confirm / unsubscribe / dashboard
# links in emails (set to the Heroku URL in prod); postal-address is the
# CAN-SPAM footer. Both optional -- links are just omitted when base-url is blank.
aviary.alerts.base-url=${AVIARY_ALERTS_BASE_URL:}
aviary.alerts.postal-address=${AVIARY_ALERTS_POSTAL_ADDRESS:}

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true