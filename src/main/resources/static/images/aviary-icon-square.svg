<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aviary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BB184"/>
      <stop offset="1" stop-color="#14543A"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#062018" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- square badge (sharp corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- big centered A behind the bird -->
  <path d="M256 80 L392 432 L324 432 L300 360 L212 360 L188 432 L120 432 Z
           M256 180 L300 348 L212 348 Z"
        fill="#FBF1D6" fill-rule="evenodd" opacity="0.95" filter="url(#lift)"/>

  <!-- golden pheasant in flight (cartoon) -->
  <g filter="url(#lift)" stroke="#5A2D1B" stroke-width="4" stroke-linejoin="round">
    <!-- tail feathers (drawn first, behind body) -->
    <g fill="none" stroke-linecap="round">
      <path d="M198 214 C160 232 134 262 118 296" stroke="#E6B85A" stroke-width="11"/>
      <path d="M196 222 C148 248 116 286 96 330"  stroke="#D9A441" stroke-width="15"/>
      <path d="M192 232 C150 264 126 302 110 346"  stroke="#C8922F" stroke-width="12"/>
      <!-- tail bars -->
      <path d="M150 258 L168 270" stroke="#7A4A18" stroke-width="5"/>
      <path d="M126 296 L144 308" stroke="#7A4A18" stroke-width="5"/>
      <path d="M104 334 L122 346" stroke="#7A4A18" stroke-width="5"/>
    </g>

    <!-- red body -->
    <ellipse cx="240" cy="206" rx="64" ry="44" transform="rotate(-20 240 206)" fill="#E23B30"/>

    <!-- raised wing -->
    <path d="M252 182 C234 148 228 116 248 92 C268 104 288 144 302 178
             L286 172 L294 188 L274 182 L280 198 L260 188 Z" fill="#2E8B66"/>
    <path d="M252 176 C240 152 236 128 250 108 C262 120 274 146 284 172 Z"
          fill="#6BC79A" stroke="none"/>

    <!-- head -->
    <circle cx="314" cy="170" r="30" fill="#F5C518"/>
    <!-- crest tuft -->
    <path d="M298 146 C300 132 312 126 318 134 C324 124 336 128 334 142
             C342 140 346 150 338 156 C326 150 312 150 300 156 Z" fill="#F0A92B"/>
    <!-- beak -->
    <path d="M340 164 L366 173 L340 184 Z" fill="#E8862A"/>
    <!-- eye -->
    <circle cx="322" cy="166" r="4.5" fill="#2B1A0A" stroke="none"/>
  </g>
</svg>
