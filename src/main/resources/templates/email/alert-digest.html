<!DOCTYPE html>
<!--
  Alert email (spec 013, contracts/alert-email.md). Mail apps drop <style>
  blocks and most layout, so: tables, inline styles only, no images, no
  external CSS. Every dynamic value is th:text (escaped) -- item names are
  user input.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — ' + ${counts}">Alert</title>
</head>
<body style="margin:0; padding:0; background:#F5F8F6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="width:100%; background:#F5F8F6;">
    <tr>
        <td align="center" style="padding:16px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%; max-width:600px; background:#FFFFFF; border-radius:12px;
                          font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1B2B23;">
                <tr>
                    <td style="padding:24px 24px 8px 24px;">
                        <div style="font-size:20px; font-weight:bold; line-height:1.3;" th:text="${title}">N12SAS</div>
                        <div style="font-size:14px; line-height:1.5; margin-top:2px;" th:text="${counts}">1 due soon</div>
                        <div style="font-size:12px; color:#5E7A6A; margin-top:2px;" th:text="'as of ' + ${asOf}">as of</div>
                        <div th:if="${baselineLine}" style="font-size:14px; line-height:1.5; margin-top:12px;"
                             th:text="${baselineLine}">Alerts are on.</div>
                    </td>
                </tr>

                <tr th:each="section : ${sections}">
                    <td style="padding:8px 24px 0 24px;">
                        <div th:if="${section.title}" style="font-size:16px; font-weight:bold; margin:12px 0 4px 0;"
                             th:text="${section.title}">N1AA (Cessna 172)</div>
                        <table th:each="group : ${section.groups}" role="presentation" width="100%"
                               cellpadding="0" cellspacing="0" border="0" style="width:100%; margin-top:10px;">
                            <tr>
                                <td colspan="2" th:style="'font-size:13px; font-weight:bold; text-transform:uppercase; letter-spacing:0.04em; padding:4px 0; color:' + ${group.fg} + ';'"
                                    th:text="${group.label}">Due soon</td>
                            </tr>
                            <tr th:each="item : ${group.items}">
                                <td style="font-size:15px; line-height:1.4; padding:6px 8px 6px 0; border-top:1px solid #E6EEE9; word-break:break-word;">
                                    <span th:text="${item.name}">ELT Battery</span>
                                    <span th:if="${item.isNew}"
                                          style="font-size:11px; font-weight:bold; color:#2C9B6F; margin-left:6px;">New</span>
                                </td>
                                <td align="right" style="padding:6px 0; border-top:1px solid #E6EEE9; vertical-align:top;">
                                    <span th:style="'display:inline-block; font-size:13px; line-height:1.4; border-radius:10px; padding:2px 8px; white-space:nowrap; background:' + ${group.bg} + '; color:' + ${group.fg} + ';'"
                                          th:text="${item.time}">10 days left</span>
                                </td>
                            </tr>
                        </table>
                        <div style="font-size:13px; color:#5E7A6A; margin-top:10px;" th:text="${section.hours}">Hours</div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 24px 20px 24px; font-size:14px; line-height:1.5;">
                        <div th:if="${summary != null and !summary.isEmpty()}" th:text="${summary}">The other 38 items are on track.</div>
                        <div th:text="${attachment}">The full Status Sheet is attached (PDF).</div>
                    </td>
                </tr>

                <tr th:if="${footerSentence}">
                    <td style="padding:16px 24px 24px 24px; border-top:1px solid #E6EEE9; font-size:12px; line-height:1.5; color:#5E7A6A;">
                        <div th:text="${footerSentence}">You're receiving this because…</div>
                        <div th:if="${unsubscribeUrl}" style="margin-top:6px;">
                            <a th:href="${unsubscribeUrl}" style="color:#2C9B6F;">Stop these emails</a>
                        </div>
                        <div th:if="${postalAddress}" style="margin-top:6px;" th:text="${postalAddress}">Address</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
